AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Service Desk Trainer - serverless build.
  S3 (data + frontend) + CloudFront + HTTP API + Lambda, plus one small
  App Runner container for the live-voice WebSocket relay.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Long random string for session cookies (openssl rand -base64 48).
  TextModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: Claude Sonnet model id / inference profile for chat turns and scoring.
  VoiceModelId:
    Type: String
    Default: amazon.nova-sonic-v1:0
  VoiceImageUri:
    Type: String
    Default: ''
    Description: ECR image URI built from Dockerfile.voice. Leave empty to deploy without voice mode.
  SmtpUrl:
    Type: String
    Default: ''
    NoEcho: true
  MailFrom:
    Type: String
    Default: ''
  AdminEmail:
    Type: String
    Default: ''
  AdminPassword:
    Type: String
    Default: ''
    NoEcho: true
  SkipOtpEmails:
    Type: String
    Default: ''
    Description: >
      Comma-separated exact emails that skip the OTP step on login (e.g. a
      bootstrap admin at a domain that can never receive mail). Empty by
      default - every account requires OTP unless explicitly listed here.

Conditions:
  HasVoice: !Not [!Equals [!Ref VoiceImageUri, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 60

Resources:

  # ------------------------------------------------------------------ data
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }   # cheap undo button for a JSON "database"

  # ------------------------------------------------------------------ frontend
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The CSP the Node server used to send now comes from CloudFront. connect-src
  # uses a regional API Gateway wildcard rather than the exact API URL to avoid a
  # CloudFormation dependency cycle (Lambda -> Distribution -> policy -> API -> Lambda).
  ResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-headers'
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: same-origin, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Join
              - '; '
              - - "default-src 'self'"
                - "script-src 'self'"
                - "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com"
                - "font-src 'self' https://fonts.gstatic.com"
                - "img-src 'self' data:"
                - !Sub "connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com wss://*.${AWS::Region}.awsapprunner.com"
                - "frame-ancestors 'none'"
                - "base-uri 'self'"
                - "form-action 'self'"
                - "object-src 'none'"
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(self), geolocation=()
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed CachingOptimized
          ResponseHeadersPolicyId: !Ref ResponseHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CleanUrls.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403          # S3 returns 403 for missing keys via OAC
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  # express.static used to map /login -> login.html; CloudFront does it here.
  CleanUrls:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-clean-urls'
      AutoPublish: true
      FunctionConfig: { Comment: 'Append .html to extensionless paths', Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          if (uri === '/') { req.uri = '/index.html'; return req; }
          if (!uri.includes('.') && !uri.endsWith('/')) { req.uri = uri + '.html'; }
          return req;
        }

  # ------------------------------------------------------------------ API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # CORS is handled inside Express (it must echo a specific allowed origin
      # alongside credentials, which API Gateway's static CORS config can't do).

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/handler.handler
      CodeUri: ../
      Description: Service Desk Trainer API (Express via serverless-http)
      Environment:
        Variables:
          NODE_ENV: production
          DATA_BUCKET: !Ref DataBucket
          JWT_SECRET: !Ref JwtSecret
          BEDROCK_TEXT_MODEL: !Ref TextModelId
          FRONTEND_ORIGIN: !Sub 'https://${Distribution.DomainName}'
          VOICE_WS_URL: !If [HasVoice, !Sub 'wss://${VoiceService.ServiceUrl}/ws/voice', '']
          SMTP_URL: !Ref SmtpUrl
          MAIL_FROM: !Ref MailFrom
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_PASSWORD: !Ref AdminPassword
          SKIP_OTP_EMAILS: !Ref SkipOtpEmails
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
              Resource: [!GetAtt DataBucket.Arn, !Sub '${DataBucket.Arn}/*']
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: '*'   # inference profiles resolve to per-region model ARNs; scope down once you know yours
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # ------------------------------------------------------------------ voice (always-on container)
  VoiceInstanceRole:
    Type: AWS::IAM::Role
    Condition: HasVoice
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: voice
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject]          # session-epoch check on the WebSocket upgrade
                Resource: !Sub '${DataBucket.Arn}/users/*'
              - Effect: Allow
                # Nova Sonic's bidirectional stream needs SigV4 credentials, which this
                # instance role supplies - no access keys to manage.
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:InvokeModelWithBidirectionalStream]
                Resource: '*'

  VoiceAccessRole:
    Type: AWS::IAM::Role
    Condition: HasVoice
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess]

  VoiceService:
    Type: AWS::AppRunner::Service
    Condition: HasVoice
    Properties:
      ServiceName: !Sub '${AWS::StackName}-voice'
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration: { AccessRoleArn: !GetAtt VoiceAccessRole.Arn }
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Ref VoiceImageUri
          ImageConfiguration:
            Port: '8080'
            RuntimeEnvironmentVariables:
              - { Name: NODE_ENV, Value: production }
              - { Name: DATA_BUCKET, Value: !Ref DataBucket }
              - { Name: JWT_SECRET, Value: !Ref JwtSecret }
              - { Name: BEDROCK_VOICE_MODEL, Value: !Ref VoiceModelId }
              - { Name: BEDROCK_TEXT_MODEL, Value: !Ref TextModelId }
              - { Name: FRONTEND_ORIGIN, Value: !Sub 'https://${Distribution.DomainName}' }
      InstanceConfiguration:
        Cpu: '0.5 vCPU'
        Memory: '1 GB'
        InstanceRoleArn: !GetAtt VoiceInstanceRole.Arn
      HealthCheckConfiguration: { Protocol: HTTP, Path: /health }

Outputs:
  FrontendUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DataBucketName:
    Value: !Ref DataBucket
  DistributionId:
    Value: !Ref Distribution
  VoiceWsUrl:
    Value: !If [HasVoice, !Sub 'wss://${VoiceService.ServiceUrl}/ws/voice', 'voice disabled (no VoiceImageUri)']
